<div class="skeleton-table-container" role="status" aria-live="polite" aria-busy="true">
  <span class="sr-only">Loading products...</span>

  <div class="table-container">
    <table class="skeleton-table">
      <thead>
        <tr>
          <th class="sku-col">
            <app-skeleton width="60px" height="0.875rem"></app-skeleton>
          </th>
          <th class="name-col">
            <app-skeleton width="80px" height="0.875rem"></app-skeleton>
          </th>
          <th class="quantity-col">
            <app-skeleton width="70px" height="0.875rem"></app-skeleton>
          </th>
          <th class="status-col">
            <app-skeleton width="60px" height="0.875rem"></app-skeleton>
          </th>
          <th class="date-col">
            <app-skeleton width="70px" height="0.875rem"></app-skeleton>
          </th>
          <th class="actions-col">
            <app-skeleton width="80px" height="0.875rem"></app-skeleton>
          </th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let row of rowArray; let i = index" class="skeleton-row">
          <td class="sku-cell">
            <app-skeleton
              [width]="i % 3 === 0 ? '90px' : i % 2 === 0 ? '85px' : '80px'"
              height="1rem"
            ></app-skeleton>
          </td>
          <td class="name-cell">
            <app-skeleton
              [width]="
                i % 4 === 0 ? '220px' : i % 3 === 0 ? '180px' : i % 2 === 0 ? '200px' : '160px'
              "
              height="1rem"
            ></app-skeleton>
          </td>
          <td class="quantity-cell">
            <app-skeleton [width]="i % 2 === 0 ? '35px' : '45px'" height="1rem"></app-skeleton>
          </td>
          <td class="status-cell">
            <app-skeleton width="70px" height="1.5rem" borderRadius="9999px"></app-skeleton>
          </td>
          <td class="date-cell">
            <app-skeleton width="75px" height="1rem"></app-skeleton>
          </td>
          <td class="actions-cell">
            <div class="skeleton-actions">
              <app-skeleton width="2rem" height="1.875rem" borderRadius="0.375rem"></app-skeleton>
              <app-skeleton width="2rem" height="1.875rem" borderRadius="0.375rem"></app-skeleton>
              <app-skeleton width="2rem" height="1.875rem" borderRadius="0.375rem"></app-skeleton>
              <app-skeleton width="2rem" height="1.875rem" borderRadius="0.375rem"></app-skeleton>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
