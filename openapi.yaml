components:
  schemas:
    CreateInventoryPayload:
      type: object
      properties:
        partNumber:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        stockQuantity:
          type: integer
          format: int32
    CreateProductPayload:
      type: object
      properties:
        sku:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        dimensions:
          $ref: '#/components/schemas/NullableOfProductDimensions'
        inventoryItemId:
          type: string
          format: uuid
          nullable: true
        stockThreshold:
          type: integer
          format: int32
          nullable: true
        leadTime:
          pattern: '^-?(\d+\.)?\d{2}:\d{2}:\d{2}(\.\d{1,7})?$'
          type: string
          nullable: true
    InventoryModel:
      type: object
      properties:
        inventoryId:
          type: string
          format: uuid
        partNumber:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        stockQuantity:
          type: integer
          format: int32
        status:
          $ref: '#/components/schemas/InventoryStatus'
        createdOn:
          type: string
          format: date-time
        updatedOn:
          type: string
          format: date-time
    InventoryStatus:
      type: integer
    NullableOfProductDimensions:
      type: object
      properties:
        width:
          type: number
          format: double
          nullable: true
        length:
          type: number
          format: double
          nullable: true
        height:
          type: number
          format: double
          nullable: true
        weight:
          type: number
          format: double
          nullable: true
      nullable: true
    NullableOfProductDimensions2:
      type: object
      properties:
        width:
          type: number
          format: double
          nullable: true
        length:
          type: number
          format: double
          nullable: true
        height:
          type: number
          format: double
          nullable: true
        weight:
          type: number
          format: double
          nullable: true
    PaginatedResponseOfInventoryModel:
      required:
        - totalItems
        - page
        - size
        - results
      type: object
      properties:
        totalItems:
          type: integer
          format: int32
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        results:
          type: array
          items:
            $ref: '#/components/schemas/InventoryModel'
    PaginatedResponseOfProductModel:
      required:
        - totalItems
        - page
        - size
        - results
      type: object
      properties:
        totalItems:
          type: integer
          format: int32
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        results:
          type: array
          items:
            $ref: '#/components/schemas/ProductModel'
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
    ProductModel:
      type: object
      properties:
        productId:
          type: string
          format: uuid
        sku:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        dimensions:
          $ref: '#/components/schemas/NullableOfProductDimensions'
        inventoryItemId:
          type: string
          format: uuid
          nullable: true
        stockThreshold:
          type: integer
          format: int32
          nullable: true
        leadTime:
          pattern: '^-?(\d+\.)?\d{2}:\d{2}:\d{2}(\.\d{1,7})?$'
          type: string
          nullable: true
        isStocked:
          type: boolean
        isEnabled:
          type: boolean
        isAvailable:
          type: boolean
        createdOn:
          type: string
          format: date-time
        updatedOn:
          type: string
          format: date-time
tags:
  - name: InventoryEndpoints
  - name: ProductEndpoints
